[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcv-cli"
version = "0.3.0"
description = "A small command-line client for MyCourseVille"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "cryptography>=44,<51",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "platformdirs>=4,<5",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "rapidfuzz>=3,<4",
    "rich>=13.7,<15",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
fzf = [
    "fzf-bin>=0.74,<1",
]

[project.scripts]
mcv = "mcv_cli.cli.app:app"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pip-audit>=2.7,<3",
    "respx>=0.22,<1",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcv_cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "live: authenticated read-only MyCourseVille end-to-end checks (opt-in)",
]
