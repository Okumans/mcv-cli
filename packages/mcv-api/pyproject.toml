[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcv-api"
version = "0.6.1"
description = "A reusable Python client for reading MyCourseVille content"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "rapidfuzz>=3,<4",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcv_api"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
