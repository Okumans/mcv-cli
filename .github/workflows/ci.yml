name: checks

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: >-
          uv run pytest -q --cov=mcv_cli --cov=mcv_api
          --cov-report=term-missing --cov-fail-under=80

      - name: Check formatting and lint
        run: uv run ruff check .

      - name: Reject explicit Any in production source
        run: python scripts/check_no_explicit_any.py

      - name: Type check
        run: uv run pyright

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Build CLI and API packages
        run: |
          uv build
          uv build --package mcv-api

      - name: Install API wheel by itself
        shell: bash
        run: |
          api_wheel="$(find dist -maxdepth 1 -type f -name 'mcv_api-*.whl' -print -quit)"
          test -n "$api_wheel"
          api_env="$RUNNER_TEMP/mcv-api-wheel-${{ matrix.python-version }}"
          python -m venv "$api_env"
          uv pip install --python "$api_env/bin/python" "$api_wheel"
          "$api_env/bin/python" -c '
          import importlib.util
          import mcv_api
          from mcv_api import MCVAPI, SessionProvider
          assert mcv_api.__version__ == "0.6.0"
          assert MCVAPI is not None and SessionProvider is not None
          assert importlib.util.find_spec("typer") is None
          assert importlib.util.find_spec("rich") is None
          assert importlib.util.find_spec("mcv_cli") is None
          '

      - name: Install CLI and API wheels in an isolated environment
        shell: bash
        run: |
          api_wheel="$(find dist -maxdepth 1 -type f -name 'mcv_api-*.whl' -print -quit)"
          cli_wheel="$(find dist -maxdepth 1 -type f -name 'mcv_cli-*.whl' -print -quit)"
          test -n "$api_wheel"
          test -n "$cli_wheel"
          wheel_env="$RUNNER_TEMP/mcv-wheel-${{ matrix.python-version }}"
          python -m venv "$wheel_env"
          uv pip install --python "$wheel_env/bin/python" "$api_wheel" "$cli_wheel"
          "$wheel_env/bin/mcv" --version
          "$wheel_env/bin/mcv" --help >/dev/null

      - name: Run installed-package integration checks
        shell: bash
        run: |
          api_wheel="$(find dist -maxdepth 1 -type f -name 'mcv_api-*.whl' -print -quit)"
          cli_wheel="$(find dist -maxdepth 1 -type f -name 'mcv_cli-*.whl' -print -quit)"
          test -n "$api_wheel"
          test -n "$cli_wheel"
          wheel_env="$RUNNER_TEMP/mcv-wheel-${{ matrix.python-version }}"
          uv pip install --python "$wheel_env/bin/python" "$api_wheel" "$cli_wheel[fzf]"
          test -x "$wheel_env/bin/fzf"
          PATH="$wheel_env/bin:$PATH" \
            MCV_INTEGRATION_MCV="$wheel_env/bin/mcv" \
            MCV_INTEGRATION_PYTHON="$wheel_env/bin/python" \
            MCV_INTEGRATION_FZF="$wheel_env/bin/fzf" \
            uv run pytest -q -m integration tests/integration

      - name: Install from Git URLs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          repository_url="git+https://github.com/${GITHUB_REPOSITORY}.git@${GITHUB_SHA}"
          api_git_url="${repository_url}#subdirectory=packages/mcv-api"
          api_git_env="$RUNNER_TEMP/mcv-api-git-${{ matrix.python-version }}"
          python -m venv "$api_git_env"
          uv pip install --python "$api_git_env/bin/python" "$api_git_url"
          "$api_git_env/bin/python" -c 'from mcv_api import MCVAPI; assert MCVAPI'

          tool_dir="$RUNNER_TEMP/mcv-tools-${{ matrix.python-version }}"
          tool_bin="$RUNNER_TEMP/mcv-tool-bin-${{ matrix.python-version }}"
          mkdir -p "$tool_dir" "$tool_bin"
          UV_TOOL_DIR="$tool_dir" UV_TOOL_BIN_DIR="$tool_bin" uv tool install \
            --with "mcv-api @ ${api_git_url}" \
            "$repository_url"
          "$tool_bin/mcv" --version

  live-e2e:
    name: authenticated CLI/API live suite
    needs: quality
    if: >-
      github.event_name != 'pull_request' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    env:
      MCV_E2E_PROVIDER: ${{ secrets.MCV_E2E_PROVIDER }}
      MCV_E2E_USERNAME: ${{ secrets.MCV_E2E_USERNAME }}
      MCV_E2E_PASSWORD: ${{ secrets.MCV_E2E_PASSWORD }}
      MCV_STORAGE_PASSPHRASE: ${{ secrets.MCV_STORAGE_PASSPHRASE }}
      MCV_PREFER_KEYRING: "false"
      MCV_E2E_SEMESTER: ${{ secrets.MCV_E2E_SEMESTER }}
      MCV_E2E_PRIMARY_COURSE: ${{ secrets.MCV_E2E_PRIMARY_COURSE }}
      MCV_E2E_SECONDARY_COURSE: ${{ secrets.MCV_E2E_SECONDARY_COURSE }}
      MCV_E2E_SEARCH_QUERY: ${{ secrets.MCV_E2E_SEARCH_QUERY }}
      MCV_E2E_MATERIALS_REF: ${{ secrets.MCV_E2E_MATERIALS_REF }}
      MCV_E2E_ASSIGNMENTS_REF: ${{ secrets.MCV_E2E_ASSIGNMENTS_REF }}
      MCV_E2E_ANNOUNCEMENTS_REF: ${{ secrets.MCV_E2E_ANNOUNCEMENTS_REF }}
      MCV_E2E_MEETINGS_REF: ${{ secrets.MCV_E2E_MEETINGS_REF }}
      MCV_E2E_PLAYLISTS_REF: ${{ secrets.MCV_E2E_PLAYLISTS_REF }}
      MCV_E2E_MATERIALS_URL: ${{ secrets.MCV_E2E_MATERIALS_URL }}
      MCV_E2E_ASSIGNMENTS_URL: ${{ secrets.MCV_E2E_ASSIGNMENTS_URL }}
      MCV_E2E_ANNOUNCEMENTS_URL: ${{ secrets.MCV_E2E_ANNOUNCEMENTS_URL }}
      MCV_E2E_MEETINGS_URL: ${{ secrets.MCV_E2E_MEETINGS_URL }}
      MCV_E2E_PLAYLISTS_URL: ${{ secrets.MCV_E2E_PLAYLISTS_URL }}
      MCV_E2E_MEETINGS_AVAILABLE: ${{ secrets.MCV_E2E_MEETINGS_AVAILABLE }}
      MCV_E2E_SCHEDULE_AVAILABLE: ${{ secrets.MCV_E2E_SCHEDULE_AVAILABLE }}
      MCV_E2E_PLAYLISTS_AVAILABLE: ${{ secrets.MCV_E2E_PLAYLISTS_AVAILABLE }}
      MCV_E2E_DOWNLOAD_AVAILABLE: ${{ secrets.MCV_E2E_DOWNLOAD_AVAILABLE }}
      MCV_E2E_ARCHIVE_AVAILABLE: ${{ secrets.MCV_E2E_ARCHIVE_AVAILABLE }}
      MCV_E2E_PRIMARY_ARCHIVE_FOLDER: ${{ secrets.MCV_E2E_PRIMARY_ARCHIVE_FOLDER }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Authenticate protected live account
        shell: bash
        env:
          MCV_CONFIG_DIR: ${{ runner.temp }}/mcv-config
          MCV_CACHE_DIR: ${{ runner.temp }}/mcv-cache
        run: |
          test -n "$MCV_E2E_USERNAME"
          test -n "$MCV_E2E_PASSWORD"
          test -n "$MCV_E2E_SEMESTER"
          test -n "$MCV_E2E_PRIMARY_COURSE"
          provider="${MCV_E2E_PROVIDER:-chula}"
          printf '%s\n' "$MCV_E2E_PASSWORD" | uv run mcv auth login \
            --type "$provider" --username "$MCV_E2E_USERNAME" --password-stdin
          uv run mcv auth status

      - name: Run authenticated read-only CLI/API matrix
        env:
          MCV_CONFIG_DIR: ${{ runner.temp }}/mcv-config
          MCV_CACHE_DIR: ${{ runner.temp }}/mcv-cache
          MCV_LIVE_E2E: "1"
          MCV_E2E_DISCOVER_FIXTURES: "0"
        run: uv run pytest -m live -q

  release-gate:
    name: release gate
    needs: [quality, live-e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Require quality and authenticated live checks
        run: echo "Quality and authenticated CLI/API live checks passed for $GITHUB_REF"
